<html>

<head>
    <title>Cat Sanctuary</title>
    <link rel="stylesheet" href="../design/pages/login.css">
</head>
<script src="../javascript/login.js" defer></script>

<body>
    <header class="header">
        <a a href="../htmls/main.html" class="logo"><img class="logo-img" src="../design/images/image.png" /></a>
        <div class="on-right">
            <a href="../htmls/map.html" class="map-button">
                <img class="map-logo" src="../design/images/image.png" />
            </a>
            <a href="../htmls/profile.html" class="profile-button">
                <img class="profile-logo" src="../design/images/Profile Button.png" />
            </a>
        </div>
    </header>
    <div class="body">
        <div class="login-window">
            <form>
                <fieldset>
                    <legend>Login</legend>
                    <input type="text" oninput="removeNumbers(event)" id="fname" name="fname" placeholder="first name" required><br><br>
                    <input type="text" oninput="removeNumbers(event)" id="lname" name="lname" placeholder="last name" required><br><br>
                    <input type="tel" oninput="removeLetters(event)" id="tel" name="tel" placeholder="phonenumber" pattern="[0-9]+" title="Please use only numbers [0-9]" required><br><br>
                    <input type="email" id="email" name="email" placeholder="email" required><br><br>
                    <input type="text" id="username" name="username" placeholder="username" required><br><br>
                    <input type="password" id="password" name="password" placeholder="password" minlength="8" required><br>
                </fieldset>
                <br>
                <input type="submit" value="OK" class="submit-btn">
            </form>
        </div>
    </div>

</body>

</html>
