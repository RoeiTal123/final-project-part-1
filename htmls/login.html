<html>

<head>
    <title>Cat Sanctuary</title>
    <link rel="stylesheet" href="../design/pages/login.css">
</head>
<script src="../javascript/login.js" defer></script>

<body>
    <header class="header">
        <a a href="../htmls/main.html" class="logo"><img class="logo-img" src="../design/images/image.png" /></a>
        <div class="on-right">
            <a href="../htmls/map.html" class="map-button">
                <img class="map-logo" src="../design/images/image.png" />
            </a>
            <a href="../htmls/profile.html" class="profile-button">
                <img class="profile-logo" src="../design/images/Profile Button.png" />
            </a>
        </div>
    </header>
    <div class="body">
        <div class="login-window">
            <form>
                <fieldset>
                    <legend>Basic</legend>
                    
                    <label for="fname">First name:</label><br>
                    <input type="text" id="fname" name="fname" placeholder="..." required><br>
                    
                    <label for="lname">Last name:</label><br>
                    <input type="text" id="lname" name="lname" placeholder="..." required><br>

                </fieldset>
                <br>
                <fieldset>
                    <legend>Contact</legend>
                    
                    <label for="tel">Phone number:</label><br>
                    <input type="tel" id="tel" name="tel" pattern="[0-9]" title="Please use only numbers [0-9]" placeholder="..."  required><br>
                    <label for="email">Email:</label><br>
                    <input type="email" id="email" name="email" title="Please use a valid email address format" pattern="[a-z0-9._%+-]+@[a-z0-9.-]+.$" required><br>
                    
                </fieldset>
                <br>
                <input type="submit" value="OK">
            </form>
        </div>
    </div>

</body>

</html>
